name: Institutional Bot with Memory

on:
  workflow_dispatch:
    inputs:
      symbol: { description: 'Pair', required: false }
      model: { description: 'Model (deepseek/nemotron)', required: false }
      cmd: { description: 'Command', required: false }

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deps
        run: pip install -r bot-reqs.txt

      - name: Run Agent
        env:
          SAKELAR_API_KEY: ${{ secrets.SAKELAR_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python handler.py --symbol "${{ github.event.inputs.symbol }}" --model "${{ github.event.inputs.model }}" --cmd "${{ github.event.inputs.cmd }}"

      # --- BAGIAN INI YANG DIPERBAIKI BIAR NGGAK BENTROK ---
      - name: Commit Log & Memory Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add log_analisa/ trades_history.json || true
          git commit -m "Update log & memory [skip ci]" || echo "Tidak ada perubahan baru"
          
          # Tarik data terbaru dulu buat ngehindarin bentrok
          git pull --rebase origin main || true
          git push || true
