name: Institutional Bot

on:
  workflow_dispatch:
    inputs:
      symbol: { description: 'Pair', required: true }
      tf: { description: 'TF (Abaikan)', required: false }
      cmd: { description: 'Command', required: false }

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # <--- Baris cache: 'pip' UDAH GW HAPUS DI SINI

      - name: Install Deps
        run: pip install -r bot-reqs.txt

      - name: Run Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python handler.py --symbol "${{ github.event.inputs.symbol }}" --tf "MTF"

      - name: Commit Log Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add log_analisa/ || true
          git commit -m "Update log analisa [skip ci]" || echo "Tidak ada log baru"
          git push || true
